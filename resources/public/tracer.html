<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Laravel Route Query Tracer — trace database reads and writes in real time." />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>Route Tracer — Database Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Reset & Design Tokens */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #fafaf8;
      --bg-panel:     #ffffff;
      --bg-subtle:    #f5f7f5;
      --bg-hover:     #f1f2f0;
      --border:       #dedfdd;
      --border-subtle:#e5e6e3;
      --border-dark:  #111111;

      --primary:      #111111;
      --primary-hover:#000000;
      --accent:       #6366f1;

      --text:         #202226;
      --text-muted:   #747774;
      --text-dim:     #898c89;

      --radius:       6px;
      --radius-sm:    5px;

      /* Read / Write / Mutate soft pastel colors */
      --read-color:   #0284c7;
      --read-bg:      #e0f2fe;
      --read-border:  #bae6fd;

      --write-color:  #15803d;
      --write-bg:     #dcfce7;
      --write-border: #bbf7d0;

      --mutate-color: #b91c1c;
      --mutate-bg:    #fee2e2;
      --mutate-border:#fecaca;

      --other-color:  #475569;
      --other-bg:     #f1f5f9;
      --other-border: #e2e8f0;
    }

    html, body { height: 100%; }

    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app { display: flex; flex-direction: column; min-height: 100vh; }

    /* Topbar */
    .header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      height: 56px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 6px;
      background: #111;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-sep {
      width: 1px;
      height: 18px;
      background: var(--border);
    }

    .header-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: #edf0ed;
      color: #686b68;
      font-family: 'JetBrains Mono', monospace;
    }

    .header-nav {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .nav-btn:hover { background: var(--bg-hover); }
    .nav-btn.primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--border-dark);
    }
    .nav-btn.primary:hover { background: var(--primary-hover); }

    /* Main Content Container */
    .main { flex: 1; padding: 24px 28px; max-width: 1400px; margin: 0 auto; width: 100%; }

    /* Request Bar */
    .request-bar {
      display: flex;
      gap: 0;
      align-items: center;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
      margin-bottom: 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      transition: border-color 0.15s;
    }

    .request-bar:focus-within { border-color: var(--border-dark); }

    .method-select {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      cursor: pointer;
      outline: none;
      margin-right: 8px;
    }

    .method-select option { background: #ffffff; color: var(--text); }

    .app-url-input {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      background: transparent;
      border: none;
      outline: none;
      width: 180px;
      flex-shrink: 0;
      border-right: 1px solid var(--border-subtle);
      padding: 8px 10px 8px 0;
    }

    .path-input-wrap {
      flex: 1;
      position: relative;
      min-width: 0;
      display: flex;
      align-items: center;
    }

    .path-input {
      width: 100%;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--text);
      background: transparent;
      border: none;
      outline: none;
      padding: 8px 12px;
      min-width: 0;
    }

    .path-input::placeholder { color: var(--text-dim); }

    .route-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.06);
      max-height: 280px;
      overflow-y: auto;
      z-index: 250;
      display: none;
    }

    .route-dropdown.visible { display: block; }

    .route-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.1s;
    }

    .route-item:last-child { border-bottom: none; }
    .route-item:hover, .route-item.selected { background: var(--bg-hover); }

    .route-method-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
      min-width: 44px;
      text-align: center;
    }

    .rmb-get { background: #e0f2fe; color: #0369a1; }
    .rmb-post { background: #dcfce7; color: #15803d; }
    .rmb-put, .rmb-patch { background: #fef3c7; color: #b45309; }
    .rmb-delete { background: #fee2e2; color: #b91c1c; }

    .route-uri {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route-action {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .route-empty {
      padding: 12px;
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
    }

    .run-btn {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      background: #111111;
      border: 1px solid #000000;
      border-radius: var(--radius-sm);
      padding: 8px 18px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .run-btn:hover { background: #000000; }
    .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Cookie row - auth badge */
    .auth-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: -14px;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--indigo);
      background: var(--indigo-dim);
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 999px;
      padding: 3px 10px;
    }

    .auth-badge-dot {
      width: 6px; height: 6px;
      background: var(--indigo);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--indigo);
    }

    .auth-badge-muted {
      color: var(--text-dim);
      background: var(--bg-2);
      border-color: var(--border);
    }

    .auth-badge-muted .auth-badge-dot {
      background: var(--text-dim);
      box-shadow: none;
    }

    .auth-config-hint {
      font-size: 11px;
      color: var(--text-dim);
    }

    .auth-config-hint code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      background: var(--bg);
      padding: 1px 5px;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .run-btn:hover { opacity: 0.88; }
    .run-btn:active { transform: scale(0.97); }
    .run-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .run-btn .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .run-btn.loading .spinner { display: block; }
    .run-btn.loading .btn-label { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error Banner */
    .error-banner {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: var(--rose-dim);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 20px;
      font-size: 13px;
      line-height: 1.5;
    }

    .error-banner.visible { display: flex; }

    .error-banner-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }

    .error-banner strong { color: var(--rose); display: block; margin-bottom: 2px; }

    /* N+1 Problem Banner */
    .n-plus-one-banner {
      display: none;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 20px;
      box-shadow: 0 1px 3px rgba(245,158,11,0.06);
    }

    .n-plus-one-banner.visible { display: block; }

    .n-plus-one-banner-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .n-plus-one-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .n-plus-one-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f59e0b;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .n-plus-one-headline {
      font-size: 13px;
      font-weight: 600;
      color: #92400e;
    }

    .n-plus-one-filter-btn {
      font-size: 11px;
      font-weight: 600;
      color: #92400e;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .n-plus-one-filter-btn:hover {
      background: #fde68a;
      color: #78350f;
    }

    .n-plus-one-filter-btn.active {
      background: #92400e;
      color: #ffffff;
      border-color: #78350f;
    }

    .n-plus-one-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .n-plus-one-item {
      background: #ffffff;
      border: 1px solid #fef08a;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
    }

    .n-plus-one-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .n-plus-one-item-count {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: #b45309;
      font-size: 12px;
    }

    .n-plus-one-item-time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .n-plus-one-item-sql {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #1e293b;
      background: #f8fafc;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      word-break: break-all;
      margin: 4px 0 6px;
    }

    .n-plus-one-item-tip {
      font-size: 11px;
      color: #78350f;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Step badges */
    .n1-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
      border-radius: 999px;
      padding: 2px 7px;
      letter-spacing: 0.03em;
    }

    .duplicate-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 2px 6px;
    }

    .table-node.is-n1 {
      border-left: 3px solid #f59e0b;
    }

    .step-row.filtered-out,
    .connector.filtered-out,
    .timing-row.filtered-out {
      display: none !important;
    }

    /* Caller Pill / Code Origin */
    .caller-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: #334155;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 3px 8px;
      text-decoration: none;
      margin-top: 6px;
      transition: all 0.15s ease;
      cursor: pointer;
      max-width: 100%;
      overflow: hidden;
    }

    .caller-pill:hover {
      background: #e2e8f0;
      color: #0f172a;
      border-color: #94a3b8;
    }

    .caller-icon {
      flex-shrink: 0;
      opacity: 0.7;
    }

    .caller-file {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .caller-jump {
      font-size: 10px;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .ide-picker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .ide-select {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 5px 8px;
      cursor: pointer;
      outline: none;
    }

    /* Slow Query & EXPLAIN Badges */
    .slow-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      background: #fff1f2;
      color: #e11d48;
      border: 1px solid #fecdd3;
      border-radius: 999px;
      padding: 2px 7px;
    }

    .scan-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      border-radius: 999px;
      padding: 2px 7px;
    }

    .index-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      background: #fefce8;
      color: #ca8a04;
      border: 1px solid #fef08a;
      border-radius: 999px;
      padding: 2px 7px;
    }

    .explain-container {
      margin-top: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px 12px;
    }

    .explain-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 6px;
    }

    .explain-title {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .scan-alert-pill {
      font-size: 10px;
      font-weight: 700;
      background: #fee2e2;
      color: #b91c1c;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .index-ok-pill {
      font-size: 10px;
      font-weight: 700;
      background: #dcfce7;
      color: #15803d;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .scan-warning-callout {
      font-size: 11px;
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 4px;
      padding: 6px 10px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .explain-table-wrap {
      overflow-x: auto;
      max-width: 100%;
    }

    .explain-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-align: left;
    }

    .explain-table th {
      background: #f1f5f9;
      color: #475569;
      padding: 5px 8px;
      border: 1px solid #e2e8f0;
      font-weight: 600;
      font-size: 10px;
      white-space: nowrap;
    }

    .explain-table td {
      padding: 5px 8px;
      border: 1px solid #e2e8f0;
      color: #1e293b;
      background: #ffffff;
      white-space: nowrap;
    }

    /* Stats Row */
    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .stat-chip.visible { opacity: 1; transform: translateY(0); }

    .stat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .stat-chip .value { color: var(--text); font-weight: 600; }

    /* Main grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 1000px) {
      .grid { grid-template-columns: 1fr; }
    }

    /* Flow canvas */
    .canvas-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      min-height: 480px;
      position: relative;
      overflow: hidden;
    }

    .canvas-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(99,102,241,0.06), transparent);
      pointer-events: none;
    }

    .canvas-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .canvas-title::before {
      content: '';
      width: 3px;
      height: 14px;
      background: var(--indigo);
      border-radius: 2px;
    }

    /* Empty state */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-dim);
    }

    .empty-state-icon {
      font-size: 48px;
      opacity: 0.4;
    }

    .empty-state-text { font-size: 14px; }

    /* Flow nodes area */
    .flow-area {
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
    }

    /* Request node */
    .request-node {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--indigo-dim);
      border: 1px solid rgba(99,102,241,0.4);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 0;
      opacity: 0;
      transform: translateX(-12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .request-node.visible { opacity: 1; transform: translateX(0); }

    .request-node-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--indigo);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .request-node-info { flex: 1; min-width: 0; }

    .request-node-method {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--indigo);
      margin-bottom: 2px;
    }

    .request-node-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .request-node-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .status-2xx { background: var(--emerald-dim); color: var(--emerald); }
    .status-4xx { background: var(--amber-dim); color: var(--amber); }
    .status-5xx { background: var(--rose-dim); color: var(--rose); }

    /* Connector line between nodes */
    .connector {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 24px;
      height: 20px;
      margin: 2px 0;
      color: var(--text-dim);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .connector.visible { opacity: 1; }

    .connector-line {
      width: 1px;
      flex: 1;
      background: var(--border);
    }

    .connector-arrow {
      color: var(--text-dim);
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Query step row  */
    .step-row {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 0 10px;
      align-items: start;
    }

    .step-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 8px;
    }

    .step-num {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      background: #ffffff;
      color: var(--text-muted);
      border: 1px solid var(--border);
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      transition: border-color 0.15s, color 0.15s;
    }

    .step-row:hover .step-num {
      border-color: var(--border-dark);
      color: var(--text);
    }

    /* Table node card */
    .table-node {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 4px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
      opacity: 0;
      transform: translateX(10px);
    }

    .table-node.visible { opacity: 1; transform: translateX(0); }

    .table-node:hover {
      border-color: var(--type-color, var(--indigo));
      background: var(--type-bg, var(--indigo-dim));
      transform: translateX(3px);
    }

    .table-node.expanded { border-color: var(--type-color, var(--indigo)); }

    .table-node-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-icon {
      font-size: 14px;
      flex-shrink: 0;
    }

    .table-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
    }

    .table-type-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 7px;
      border-radius: 999px;
      color: var(--type-color, var(--indigo));
    }

    .table-time {
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }

    /* SQL detail (expanded) */
    .sql-detail {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .table-node.expanded .sql-detail { display: block; }

    .sql-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-muted);
      white-space: pre-wrap;
      word-break: break-all;
      overflow-x: auto;
    }

    .bindings-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    /* Sidebar */
    .sidebar { display: flex; flex-direction: column; gap: 16px; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-body { padding: 16px 18px; }

    /* Table summary */
    .table-summary-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .table-summary-row:last-child { border-bottom: none; }
    .table-summary-row.visible { opacity: 1; transform: translateY(0); }

    .tsrow-name {
      flex: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ts-pills { display: flex; gap: 4px; flex-shrink: 0; }

    .ts-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .ts-pill.read    { background: var(--read-bg);   color: var(--read-color);   border: 1px solid var(--read-border); }
    .ts-pill.write   { background: var(--write-bg);  color: var(--write-color);  border: 1px solid var(--write-border); }
    .ts-pill.mutate  { background: var(--mutate-bg); color: var(--mutate-color); border: 1px solid var(--mutate-border); }

    /* Legend */
    .legend { display: flex; flex-direction: column; gap: 8px; }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-dot.read   { background: #38bdf8; }
    .legend-dot.write  { background: #4ade80; }
    .legend-dot.mutate { background: #f87171; }
    .legend-dot.other  { background: #94a3b8; }

    /* Timing bar */
    .timing-list { display: flex; flex-direction: column; gap: 8px; }

    .timing-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .timing-row.visible { opacity: 1; transform: translateY(0); }

    .timing-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    .timing-table {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timing-ms {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .timing-bar-track {
      height: 4px;
      background: var(--bg-3);
      border-radius: 2px;
      overflow: hidden;
    }

    .timing-bar-fill {
      height: 100%;
      border-radius: 2px;
      width: 0;
      transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
    }

    /* Tooltip */
    #tooltip {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      display: none;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      max-width: 380px;
      box-shadow: var(--shadow-lg);
      line-height: 1.6;
      color: var(--text-muted);
    }

    /* Keyframes */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .pulse-ring {
      animation: pulseRing 2s ease-in-out infinite;
    }

    @keyframes pulseRing {
      0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.3); }
      50%       { box-shadow: 0 0 0 6px rgba(99,102,241,0); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 3px; }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <a href="/" class="brand-title" aria-label="Back to schema viewer">
      <div class="brand-mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg></div>
      <span>Database Visualizer</span>
    </a>
    <!-- <span class="header-badge">Route Tracer</span> -->

    <nav class="header-nav">
      <div class="ide-picker" title="Preferred code editor for stack trace links">
        <span>Editor:</span>
        <select id="ideSelect" class="ide-select" onchange="changeIde(this.value)" aria-label="Preferred IDE">
          <option value="vscode">VS Code</option>
          <option value="phpstorm">PhpStorm</option>
          <option value="cursor">Cursor</option>
          <option value="subl">Sublime</option>
        </select>
      </div>
      <a href="/" class="nav-btn primary">Schema</a>
      <!-- <a href="/tracer.html" class="nav-btn primary">Route Tracer</a> -->
    </nav>
  </header>

  <!-- Main -->
  <main class="main" id="main">

    <!-- Request bar -->
    <div class="request-bar" role="search" aria-label="Route tracer input">
      <select class="method-select" id="methodSelect" aria-label="HTTP method">
        <option>GET</option>
        <option>POST</option>
        <option>PUT</option>
        <option>PATCH</option>
        <option>DELETE</option>
      </select>

      <input
        id="appUrlInput"
        class="app-url-input"
        type="url"
        placeholder="http://127.0.0.1:8000"
        aria-label="Application base URL"
        title="Your Laravel app base URL"
      />

      <div class="path-input-wrap">
        <input
          id="pathInput"
          class="path-input"
          type="text"
          placeholder="Type or select a route (e.g. /api/profile)..."
          aria-label="Route path to trace"
          autocomplete="off"
          spellcheck="false"
        />
        <div id="routeDropdown" class="route-dropdown" role="listbox"></div>
      </div>

      <button id="runBtn" class="run-btn pulse-ring" aria-label="Run trace">
        <div class="spinner" aria-hidden="true"></div>
        <span class="btn-label"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="vertical-align:-1px;margin-right:4px;"><polygon points="5 3 19 12 5 21 5 3"/></svg>Trace</span>
      </button>
    </div>

    <!-- Error banner -->
    <div id="errorBanner" class="error-banner" role="alert">
      <div class="error-banner-top">
        <span class="error-banner-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span>
        <div>
          <strong id="errorTitle">Connection failed</strong>
          <span id="errorMsg"></span>
        </div>
      </div>
      <div id="errorFix" class="error-fix"></div>
    </div>

    <!-- N+1 Alert Banner -->
    <div id="nPlusOneBanner" class="n-plus-one-banner" role="alert">
      <div class="n-plus-one-banner-header">
        <div class="n-plus-one-title-group">
          <span class="n-plus-one-badge"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>N+1 Detected</span>
          <span class="n-plus-one-headline" id="nPlusOneHeadline"></span>
        </div>
        <button id="toggleN1FilterBtn" class="n-plus-one-filter-btn" type="button" onclick="toggleN1Filter()">
          <span>Filter N+1 Queries</span>
        </button>
      </div>
      <div class="n-plus-one-list" id="nPlusOneList"></div>
    </div>

    <!-- Stats row -->
    <div class="stats-row" id="statsRow" aria-live="polite"></div>

    <!-- Content grid -->
    <div class="grid">

      <!-- Left: Flow canvas -->
      <div class="canvas-card" id="canvasCard">
        <div class="canvas-title">Query Flow</div>

        <div class="empty-state" id="emptyState">
          <div class="empty-state-text">Enter a route path and click <strong>Trace</strong></div>
        </div>

        <div class="flow-area" id="flowArea" style="display:none"></div>
      </div>

      <!-- Right: Sidebar panels -->
      <aside class="sidebar">

        <!-- Table summary -->
        <div class="panel" id="tableSummaryPanel" style="display:none">
          <div class="panel-header">Tables Touched</div>
          <div class="panel-body" id="tableSummaryBody"></div>
        </div>

        <!-- Timing -->
        <div class="panel" id="timingPanel" style="display:none">
          <div class="panel-header">Query Timing</div>
          <div class="panel-body">
            <div class="timing-list" id="timingList"></div>
          </div>
        </div>

        <!-- Legend -->
        <div class="panel">
          <div class="panel-header">Legend</div>
          <div class="panel-body">
            <div class="legend">
              <div class="legend-row"><div class="legend-dot read"></div> SELECT — read</div>
              <div class="legend-row"><div class="legend-dot write"></div> INSERT — write</div>
              <div class="legend-row"><div class="legend-dot mutate"></div> UPDATE / DELETE — mutate</div>
              <div class="legend-row"><div class="legend-dot other"></div> Other (SET, SHOW…)</div>
            </div>
          </div>
        </div>

      </aside>
    </div>
  </main>

</div>

<!-- Tooltip -->
<div id="tooltip" role="tooltip"></div>

<script>
// Route Tracer — Client Script

const $ = id => document.getElementById(id);

// Config
const TYPE = {
  read:   { color: '#0284c7', bg: '#e0f2fe', label: 'SELECT' },
  write:  { color: '#15803d', bg: '#dcfce7', label: 'INSERT' },
  mutate: { color: '#b91c1c', bg: '#fee2e2', label: 'UPDATE/DELETE' },
  other:  { color: '#475569', bg: '#f1f5f9', label: 'OTHER' },
};

// State
let lastResult = null;
let isN1FilterActive = false;
let appRoutes = [];
let activeRouteIndex = -1;

// Init: load app URL from server env
async function loadEnv() {
  try {
    const res  = await fetch('/api/env');
    const data = await res.json();
    if (data.app_url) {
      $('appUrlInput').value = data.app_url.replace(/\/+$/, '');
    }
    const savedIde = localStorage.getItem('db_tracer_ide') || data.ide || 'vscode';
    if ($('ideSelect')) {
      $('ideSelect').value = savedIde;
    }
    if (data.tracer_enabled === false) {
      showError('Tracer Disabled', 'Set DB_TRACER_ENABLED=true in your .env to enable tracing.');
    }
  } catch (_) {
    $('appUrlInput').value = 'http://127.0.0.1:8000';
    const savedIde = localStorage.getItem('db_tracer_ide') || 'vscode';
    if ($('ideSelect')) {
      $('ideSelect').value = savedIde;
    }
  }

  // Load route collection for autocomplete
  loadRoutes();
}

async function loadRoutes() {
  try {
    const res = await fetch('/api/routes');
    if (res.ok) {
      appRoutes = await res.json();
    }
  } catch (_) {
    appRoutes = [];
  }
}

function changeIde(ide) {
  localStorage.setItem('db_tracer_ide', ide);
  if (lastResult) {
    renderResults(lastResult);
  }
}

function getIdeUrl(file, line) {
  if (!file) return '#';
  const ide = $('ideSelect')?.value || localStorage.getItem('db_tracer_ide') || 'vscode';
  const targetLine = line || 1;
  switch (ide) {
    case 'phpstorm':
      return `phpstorm://open?file=${encodeURIComponent(file)}&line=${targetLine}`;
    case 'cursor':
      return `cursor://file/${file}:${targetLine}`;
    case 'subl':
      return `subl://open?url=file://${encodeURIComponent(file)}&line=${targetLine}`;
    case 'vscode':
    default:
      return `vscode://file/${file}:${targetLine}`;
  }
}

// Run trace
async function runTrace() {
  const path    = $('pathInput').value.trim();
  const method  = $('methodSelect').value;
  const appUrl  = $('appUrlInput').value.trim().replace(/\/+$/, '');
  $('appUrlInput').value = appUrl;

  if (!path) { $('pathInput').focus(); return; }

  hideError();
  setLoading(true);
  clearResults();

  try {
    const params = new URLSearchParams({ url: path, method, app_url: appUrl });
    const res    = await fetch(`/api/trace?${params}`);
    const data   = await res.json();

    lastResult = data;

    if (!data.ok) {
      showError(data);
      return;
    }

    renderResults(data);
  } catch (err) {
    showError('Network Error', err.message);
  } finally {
    setLoading(false);
  }
}

// Render results
function renderResults(data) {
  renderNPlusOne(data.n_plus_one);
  renderStats(data);
  renderFlow(data);
  renderTableSummary(data.tables || {});
  renderTiming(data.sequence || []);
}

function renderNPlusOne(n1) {
  const banner = $('nPlusOneBanner');
  const headline = $('nPlusOneHeadline');
  const list = $('nPlusOneList');
  const filterBtn = $('toggleN1FilterBtn');

  if (!n1 || !n1.detected || !n1.alerts || !n1.alerts.length) {
    banner.classList.remove('visible');
    list.innerHTML = '';
    return;
  }

  headline.textContent = `${n1.count} N+1 pattern(s) detected • ${n1.total_waste_queries} duplicate executions (${n1.total_time_ms} ms wasted)`;
  list.innerHTML = '';

  n1.alerts.forEach(alert => {
    const item = document.createElement('div');
    item.className = 'n-plus-one-item';

    let callerLink = '';
    if (alert.caller && alert.caller.file) {
      const c = alert.caller;
      const ideUrl = getIdeUrl(c.file, c.line);
      const ideName = $('ideSelect')?.options?.[$('ideSelect')?.selectedIndex]?.text || 'IDE';
      callerLink = `
        <a href="${ideUrl}" class="caller-pill" style="margin-top:6px;display:inline-flex;" title="Open in ${ideName} (${escHtml(c.file)}:${c.line})" onclick="event.stopPropagation()">
          <span class="caller-file">Origin: ${escHtml(c.short_path)}:${c.line}</span>
          <svg class="caller-jump" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      `;
    }

    item.innerHTML = `
      <div class="n-plus-one-item-header">
        <span class="n-plus-one-item-count"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:-1px;margin-right:4px;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Executed ${alert.count}× identical queries</span>
        <span class="n-plus-one-item-time">${alert.total_time_ms} ms total</span>
      </div>
      <div class="n-plus-one-item-sql">${escHtml(alert.sql)}</div>
      <div class="n-plus-one-item-tip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:-1px;margin-right:4px;"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>${escHtml(alert.suggestion)}</div>
      ${callerLink}
    `;
    list.appendChild(item);
  });

  banner.classList.add('visible');
  if (filterBtn) {
    filterBtn.classList.remove('active');
    const span = filterBtn.querySelector('span');
    if (span) span.textContent = 'Filter N+1 Queries';
  }
  isN1FilterActive = false;
}

function renderStats(data) {
  const statusClass = data.status >= 500 ? 'status-5xx'
    : data.status >= 400 ? 'status-4xx' : 'status-2xx';

  const total  = (data.queries || []).length;
  const reads  = (data.sequence || []).filter(s => s.type === 'read').length;
  const writes = (data.sequence || []).filter(s => s.type === 'write').length;
  const muts   = (data.sequence || []).filter(s => s.type === 'mutate').length;

  const chips = [
    { dot: '#6366f1', label: `${data.duration_ms} ms total` },
    { dot: '#94a3b8', label: `${total} ${total === 1 ? 'query' : 'queries'}` },
    { dot: TYPE.read.color,   label: `${reads} reads` },
    { dot: TYPE.write.color,  label: `${writes} inserts` },
    { dot: TYPE.mutate.color, label: `${muts} mutates` },
  ];

  if (data.n_plus_one && data.n_plus_one.detected) {
    chips.push({
      dot: '#f59e0b',
      label: `${data.n_plus_one.count} N+1 (${data.n_plus_one.total_waste_queries + data.n_plus_one.count} queries)`,
    });
  }

  const slowCount = (data.queries || []).filter(q => q.is_slow).length;
  const scanCount = (data.queries || []).filter(q => q.full_table_scan).length;

  if (scanCount > 0) {
    chips.push({
      dot: '#dc2626',
      label: `${scanCount} Full Table Scan${scanCount === 1 ? '' : 's'}`,
    });
  } else if (slowCount > 0) {
    chips.push({
      dot: '#e11d48',
      label: `${slowCount} slow query${slowCount === 1 ? '' : 'ies'}`,
    });
  }

  const row = $('statsRow');
  row.innerHTML = '';

  chips.forEach((c, i) => {
    const chip = document.createElement('div');
    chip.className = 'stat-chip';
    chip.innerHTML = `<span class="stat-dot" style="background:${c.dot}"></span><span class="value">${c.label}</span>`;
    row.appendChild(chip);
    setTimeout(() => chip.classList.add('visible'), i * 60);
  });
}

function renderFlow(data) {
  const area   = $('flowArea');
  const empty  = $('emptyState');
  const seq    = data.sequence || [];

  area.innerHTML = '';
  area.style.display = 'flex';
  empty.style.display = 'none';

  // Request node
  const rn = document.createElement('div');
  rn.className = 'request-node';
  const statusClass = data.status >= 500 ? 'status-5xx'
    : data.status >= 400 ? 'status-4xx' : 'status-2xx';
  rn.innerHTML = `
    <div class="request-node-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
    <div class="request-node-info">
      <div class="request-node-method">${data.method}</div>
      <div class="request-node-path">${escHtml(data.url)}</div>
    </div>
    <span class="request-node-status ${statusClass}">${data.status}</span>
  `;
  area.appendChild(rn);
  setTimeout(() => rn.classList.add('visible'), 80);

  if (seq.length === 0) {
    const none = document.createElement('div');
    none.style.cssText = 'text-align:center;color:var(--text-dim);font-size:13px;padding:32px;';
    none.textContent = 'No database queries were captured for this request.';
    area.appendChild(none);
    return;
  }

  // Steps
  seq.forEach((step, i) => {
    const t = TYPE[step.type] || TYPE.other;
    const delay = 160 + i * 90;

    // Connector
    const conn = document.createElement('div');
    conn.className = 'connector';
    conn.dataset.isN1 = step.is_n_plus_one ? 'true' : 'false';
    conn.innerHTML = `
      <div class="connector-line"></div>
      <svg class="connector-arrow" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    `;
    area.appendChild(conn);
    setTimeout(() => conn.classList.add('visible'), delay - 40);

    // Step row
    const stepRow = document.createElement('div');
    stepRow.className = 'step-row';
    stepRow.dataset.isN1 = step.is_n_plus_one ? 'true' : 'false';
    stepRow.dataset.fingerprint = step.fingerprint || '';

    const stepCol = document.createElement('div');
    stepCol.className = 'step-col';
    stepCol.innerHTML = `<div class="step-num">${step.step}</div>`;

    // Table node
    const tn = document.createElement('div');
    tn.className = 'table-node' + (step.is_n_plus_one ? ' is-n1' : '');
    tn.style.setProperty('--type-color', t.color);
    tn.style.setProperty('--type-bg',    t.bg);

    const bindingsHtml = step.bindings && step.bindings.length
      ? `<div class="bindings-label">Bindings</div>
         <div class="sql-block">${escHtml(JSON.stringify(step.bindings, null, 2))}</div>`
      : '';

    let duplicateBadgeHtml = '';
    if (step.is_n_plus_one) {
      duplicateBadgeHtml = `<span class="n1-badge" title="N+1 Detected: ${step.duplicate_count} identical queries executed"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>N+1 (${step.duplicate_count}×)</span>`;
    } else if (step.is_duplicate) {
      duplicateBadgeHtml = `<span class="duplicate-badge" title="Duplicate query: ${step.duplicate_count} identical queries executed"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>${step.duplicate_count}×</span>`;
    }

    let slowBadgeHtml = '';
    if (step.is_slow) {
      slowBadgeHtml = `<span class="slow-badge" title="Slow Query: execution took ${step.time_ms.toFixed(1)} ms"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Slow</span>`;
    }

    let scanBadgeHtml = '';
    if (step.full_table_scan) {
      scanBadgeHtml = `<span class="scan-badge" title="Full Table Scan: No index was used for this query"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>Full Table Scan</span>`;
    } else if (step.missing_index) {
      scanBadgeHtml = `<span class="index-badge" title="Possible missing index on filtered columns"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Missing Index</span>`;
    }

    let callerPillHtml = '';
    if (step.caller && step.caller.file) {
      const c = step.caller;
      const ideUrl = getIdeUrl(c.file, c.line);
      const ideName = $('ideSelect')?.options?.[$('ideSelect')?.selectedIndex]?.text || 'IDE';
      callerPillHtml = `
        <a href="${ideUrl}" class="caller-pill" title="Click to open ${escHtml(c.file)}:${c.line} in ${ideName}" onclick="event.stopPropagation()">
          <span class="caller-file">${escHtml(c.short_path)}:${c.line}</span>
          <svg class="caller-jump" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      `;
    }

    let explainHtml = '';
    if (step.explain && step.explain.length) {
      const rows = step.explain;
      const columns = Object.keys(rows[0] || {});
      const ths = columns.map(col => `<th>${escHtml(col)}</th>`).join('');
      const trs = rows.map(r => `<tr>${columns.map(c => `<td>${escHtml(String(r[c] !== null && r[c] !== undefined ? r[c] : '-'))}</td>`).join('')}</tr>`).join('');

      explainHtml = `
        <div class="explain-container" onclick="event.stopPropagation()">
          <div class="explain-header">
            <span class="explain-title"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:4px;"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>EXPLAIN Query Plan</span>
            ${step.full_table_scan ? '<span class="scan-alert-pill">Full Table Scan</span>' : '<span class="index-ok-pill">Index Used</span>'}
          </div>
          ${step.full_table_scan ? '<div class="scan-warning-callout"><strong>Full Table Scan:</strong> Every row was scanned sequentially. Consider adding an index on the filtered / joined columns.</div>' : ''}
          <div class="explain-table-wrap">
            <table class="explain-table">
              <thead><tr>${ths}</tr></thead>
              <tbody>${trs}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    tn.innerHTML = `
      <div class="table-node-header">
        <span class="table-name">${escHtml(step.table)}</span>
        <span class="table-type-badge" style="color:${t.color}">${t.label}</span>
        ${duplicateBadgeHtml}
        ${slowBadgeHtml}
        ${scanBadgeHtml}
        <span class="table-time">${step.time_ms.toFixed(2)} ms</span>
      </div>
      ${callerPillHtml}
      <div class="sql-detail">
        <div class="sql-block">${escHtml(formatSql(step.sql))}</div>
        ${bindingsHtml}
        ${explainHtml}
      </div>
    `;

    tn.addEventListener('click', () => tn.classList.toggle('expanded'));

    stepRow.appendChild(stepCol);
    stepRow.appendChild(tn);
    area.appendChild(stepRow);

    setTimeout(() => tn.classList.add('visible'), delay);
  });
}

function renderTableSummary(tables) {
  const panel = $('tableSummaryPanel');
  const body  = $('tableSummaryBody');
  body.innerHTML = '';

  const entries = Object.entries(tables);
  if (!entries.length) { panel.style.display = 'none'; return; }

  panel.style.display = 'block';

  entries.forEach(([name, stats], i) => {
    const row = document.createElement('div');
    row.className = 'table-summary-row';
    row.innerHTML = `
      <span class="tsrow-name" title="${escHtml(name)}">${escHtml(name)}</span>
      <div class="ts-pills">
        ${stats.reads   ? `<span class="ts-pill read">R×${stats.reads}</span>` : ''}
        ${stats.writes  ? `<span class="ts-pill write">W×${stats.writes}</span>` : ''}
        ${stats.mutates ? `<span class="ts-pill mutate">M×${stats.mutates}</span>` : ''}
      </div>
    `;
    body.appendChild(row);
    setTimeout(() => row.classList.add('visible'), 200 + i * 50);
  });
}

function renderTiming(sequence) {
  const panel = $('timingPanel');
  const list  = $('timingList');
  list.innerHTML = '';

  if (!sequence.length) { panel.style.display = 'none'; return; }

  panel.style.display = 'block';

  const maxMs = Math.max(...sequence.map(s => s.time_ms), 0.01);

  sequence.forEach((step, i) => {
    const t    = TYPE[step.type] || TYPE.other;
    const pct  = Math.max((step.time_ms / maxMs) * 100, 3);
    const row  = document.createElement('div');
    row.className = 'timing-row';
    row.dataset.isN1 = step.is_n_plus_one ? 'true' : 'false';

    const n1Badge = step.is_n_plus_one ? ' <span style="color:#b45309;font-weight:700;display:inline-flex;align-items:center;gap:3px;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>N+1</span>' : '';

    row.innerHTML = `
      <div class="timing-info">
        <span class="timing-table" title="${escHtml(step.table)}">${step.step}. ${escHtml(step.table)}${n1Badge}</span>
        <span class="timing-ms">${step.time_ms.toFixed(2)} ms</span>
      </div>
      <div class="timing-bar-track">
        <div class="timing-bar-fill" style="background:${t.color}" data-pct="${pct}"></div>
      </div>
    `;
    list.appendChild(row);
    setTimeout(() => {
      row.classList.add('visible');
      const fill = row.querySelector('.timing-bar-fill');
      fill.style.width = fill.dataset.pct + '%';
    }, 300 + i * 40);
  });
}

// N+1 Filter Toggle
function toggleN1Filter() {
  isN1FilterActive = !isN1FilterActive;
  const btn = $('toggleN1FilterBtn');
  if (btn) {
    btn.classList.toggle('active', isN1FilterActive);
    const span = btn.querySelector('span');
    if (span) span.textContent = isN1FilterActive ? 'Show All Queries' : 'Filter N+1 Queries';
  }

  document.querySelectorAll('.step-row').forEach(row => {
    if (isN1FilterActive && row.dataset.isN1 !== 'true') {
      row.classList.add('filtered-out');
    } else {
      row.classList.remove('filtered-out');
    }
  });

  document.querySelectorAll('.connector').forEach(conn => {
    if (isN1FilterActive && conn.dataset.isN1 !== 'true') {
      conn.classList.add('filtered-out');
    } else {
      conn.classList.remove('filtered-out');
    }
  });

  document.querySelectorAll('.timing-row').forEach(row => {
    if (isN1FilterActive && row.dataset.isN1 !== 'true') {
      row.classList.add('filtered-out');
    } else {
      row.classList.remove('filtered-out');
    }
  });
}

// UI helpers
function setLoading(on) {
  const btn = $('runBtn');
  btn.disabled = on;
  btn.classList.toggle('loading', on);
}

function clearResults() {
  $('statsRow').innerHTML = '';
  $('flowArea').innerHTML = '';
  $('flowArea').style.display = 'none';
  $('emptyState').style.display = 'flex';
  $('tableSummaryPanel').style.display = 'none';
  $('timingPanel').style.display = 'none';
  $('tableSummaryBody').innerHTML = '';
  $('timingList').innerHTML = '';

  const banner = $('nPlusOneBanner');
  if (banner) {
    banner.classList.remove('visible');
    $('nPlusOneList').innerHTML = '';
  }
  isN1FilterActive = false;

  hideError();
}

function showError(result) {
  const status = result.status || 0;
  const msg    = result.error || 'Unknown error.';

  $('errorTitle').textContent = status ? `HTTP ${status} — Trace Failed` : 'Trace Failed';
  $('errorMsg').textContent   = ' ' + msg;
  $('errorBanner').classList.add('visible');

  // Show a contextual fix block for common errors.
  const fix = $('errorFix');
  const hints = {
    302: `<strong>Auth redirect detected.</strong> The tracer tried to authenticate as the configured user but still got redirected.<br>
          Try a different <code>DB_TRACER_AUTH_USER_ID</code> in your .env, or verify that user ID exists in your database.`,
    301: `<strong>Redirect (301).</strong> The URL was permanently redirected — try the destination URL directly.`,
    404: `<strong>Route not found.</strong> Check that the path is correct and the app server is running on the configured URL.`,
    405: `<strong>Wrong HTTP method.</strong> The route exists but doesn\'t accept <strong>${result.method}</strong>. Try a different method (e.g. GET).`,
    419: `<strong>CSRF mismatch.</strong> Paste your <code>XSRF-TOKEN</code> cookie into the Cookies field above.`,
    500: `<strong>Server error (500).</strong> The app threw an exception. Check <code>storage/logs/laravel.log</code> for details.`,
    0:   `<strong>Connection refused.</strong> Make sure <code>php artisan serve</code> is running and the App URL above is correct.`,
  };

  if (hints[status]) {
    fix.innerHTML = hints[status];
    fix.classList.add('visible');
  } else {
    fix.innerHTML = '';
    fix.classList.remove('visible');
  }
}

function hideError() {
  $('errorBanner').classList.remove('visible');
  $('errorFix').classList.remove('visible');
}

function toggleCookieHelp(e) {
  e.preventDefault();
  const box = $('cookieHelpBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

// Formatting helpers
function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/**
 * Very lightweight SQL formatter: uppercases keywords and adds newlines
 * before SELECT, FROM, WHERE, JOIN, etc. for readability.
 */
function formatSql(sql) {
  const keywords = /\b(SELECT|FROM|WHERE|JOIN|LEFT JOIN|RIGHT JOIN|INNER JOIN|OUTER JOIN|ON|AND|OR|INSERT INTO|VALUES|UPDATE|SET|DELETE FROM|GROUP BY|ORDER BY|HAVING|LIMIT|OFFSET|UNION|WITH)\b/gi;
  return sql.replace(keywords, m => '\n' + m.toUpperCase()).trimStart();
}

// Route Autocomplete Dropdown
function renderRouteDropdown(query = '') {
  const dd = $('routeDropdown');
  if (!dd) return;

  const q = query.trim().toLowerCase();
  const filtered = appRoutes.filter(r => {
    if (!q) return true;
    return r.uri.toLowerCase().includes(q) ||
           (r.name && r.name.toLowerCase().includes(q)) ||
           (r.action && r.action.toLowerCase().includes(q));
  }).slice(0, 25);

  activeRouteIndex = -1;

  if (!filtered.length) {
    if (!q) {
      hideRouteDropdown();
      return;
    }
    dd.innerHTML = '<div class="route-empty">No matching routes found</div>';
    dd.classList.add('visible');
    return;
  }

  dd.innerHTML = '';
  filtered.forEach((r, idx) => {
    const item = document.createElement('div');
    item.className = 'route-item';
    item.dataset.index = idx;

    const primaryMethod = r.methods[0] || 'GET';
    const methodClass = `rmb-${primaryMethod.toLowerCase()}`;

    item.innerHTML = `
      <span class="route-method-badge ${methodClass}">${primaryMethod}</span>
      <span class="route-uri" title="${escHtml(r.uri)}">${escHtml(r.uri)}</span>
      <span class="route-action" title="${escHtml(r.action)}">${escHtml(r.action)}</span>
    `;

    item.addEventListener('mousedown', (e) => {
      e.preventDefault();
      selectRoute(r);
    });

    dd.appendChild(item);
  });

  dd.classList.add('visible');
}

function hideRouteDropdown() {
  const dd = $('routeDropdown');
  if (dd) {
    dd.classList.remove('visible');
  }
  activeRouteIndex = -1;
}

function selectRoute(route) {
  $('pathInput').value = route.uri;

  // Auto-synchronize HTTP method dropdown
  const methods = route.methods || ['GET'];
  const preferred = methods.includes('GET') ? 'GET' : methods[0];
  if (preferred && $('methodSelect')) {
    $('methodSelect').value = preferred;
  }

  hideRouteDropdown();
}

function highlightRouteItem(index) {
  const dd = $('routeDropdown');
  if (!dd) return;
  const items = dd.querySelectorAll('.route-item');
  items.forEach((item, i) => {
    item.classList.toggle('selected', i === index);
    if (i === index) {
      item.scrollIntoView({ block: 'nearest' });
    }
  });
}

// Event listeners
$('runBtn').addEventListener('click', () => {
  hideRouteDropdown();
  runTrace();
});

$('pathInput').addEventListener('input', () => {
  renderRouteDropdown($('pathInput').value);
});

$('pathInput').addEventListener('focus', () => {
  renderRouteDropdown($('pathInput').value);
});

$('pathInput').addEventListener('keydown', e => {
  const dd = $('routeDropdown');
  const isVisible = dd && dd.classList.contains('visible');
  const items = dd ? dd.querySelectorAll('.route-item') : [];

  if (e.key === 'ArrowDown') {
    if (!isVisible) {
      renderRouteDropdown($('pathInput').value);
      return;
    }
    if (items.length) {
      activeRouteIndex = (activeRouteIndex + 1) % items.length;
      highlightRouteItem(activeRouteIndex);
      e.preventDefault();
    }
  } else if (e.key === 'ArrowUp') {
    if (isVisible && items.length) {
      activeRouteIndex = (activeRouteIndex - 1 + items.length) % items.length;
      highlightRouteItem(activeRouteIndex);
      e.preventDefault();
    }
  } else if (e.key === 'Enter') {
    if (isVisible && activeRouteIndex >= 0 && items[activeRouteIndex]) {
      items[activeRouteIndex].dispatchEvent(new MouseEvent('mousedown'));
      e.preventDefault();
    } else {
      hideRouteDropdown();
      runTrace();
    }
  } else if (e.key === 'Escape') {
    hideRouteDropdown();
  }
});

// Close autocomplete dropdown on click outside
document.addEventListener('click', e => {
  if (!e.target.closest('.path-input-wrap')) {
    hideRouteDropdown();
  }
});

// Persist app URL edits to localStorage
$('appUrlInput').addEventListener('change', () => {
  $('appUrlInput').value = $('appUrlInput').value.trim().replace(/\/+$/, '');
  localStorage.setItem('db-tracer-app-url', $('appUrlInput').value);
});
$('appUrlInput').addEventListener('blur', () => {
  $('appUrlInput').value = $('appUrlInput').value.trim().replace(/\/+$/, '');
});

// Restore from localStorage
const saved = localStorage.getItem('db-tracer-app-url');
if (saved) $('appUrlInput').value = saved.replace(/\/+$/, '');

// Clean browser URL bar (hide /tracer.html)
if (window.location.pathname.endsWith('/tracer.html')) {
  window.history.replaceState(null, '', '/tracer' + window.location.search);
}

// Bootstrap
loadEnv();
</script>
